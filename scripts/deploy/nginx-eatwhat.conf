# 《吃什么》网关 nginx 配置模板
# 使用：把两处 YOUR_DOMAIN 改成真实域名；certbot --nginx 会自动补 443 段。
#
# 路由分工：
#   /api/v1/payment/  -> 支付服务 (8791)
#   /api/v1/auth/     -> 认证服务 (8790)
#   其余全部          -> 执行代理 (8787)：/health、/v2/execution/*、
#                        /api/v1/delivery/*、/api/v1/ai/chat/completions

server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 2m;

    # 支付服务（支付宝异步回调走这里，需公网可达）
    location /api/v1/payment/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 认证服务
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 执行代理（外卖、AI 聊天转发）
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 上游最慢 90 秒，nginx 缓冲要大于它
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>吃什么 · 酒馆 UI 十案</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#170e0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{padding:44px}.head{margin-bottom:34px}.head h1{font-size:34px;margin:0 0 9px}.head p{margin:0;color:#d6bca9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.concept{--bg:#402317;--panel:#f0d7ac;--accent:#df6d2c;--accent2:#6f8b55;position:relative;overflow:hidden;border:1px solid #ffffff20;border-radius:26px;padding:26px;background:radial-gradient(circle at 80% 0%,#ffffff17,transparent 35%),linear-gradient(145deg,var(--bg),#170e0a);box-shadow:0 20px 60px #0008}.concept h2{font-size:25px;margin:0 0 5px}.concept .desc{font-size:13px;color:#ead5c6;margin-bottom:20px}.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.phone{aspect-ratio:9/19.5;border:5px solid #251710;border-radius:24px;background:var(--panel);overflow:hidden;box-shadow:0 13px 22px #0007;position:relative;color:#39251b}.bar{height:26px;background:#21140f;color:#f9e8cb;font-size:8px;padding:9px 12px}.scene{height:31%;position:relative;display:flex;align-items:flex-end;padding:13px;background:linear-gradient(#271a21aa,#e8773277),radial-gradient(circle at 70% 35%,#ffbd55 0 5%,transparent 27%),linear-gradient(120deg,#3c2517,#7d4624)}.scene:before{content:"";position:absolute;left:12%;right:12%;bottom:12%;height:37%;background:linear-gradient(90deg,#6e3d21,#9a6235);border-radius:4px;box-shadow:0 -18px #3c2418}.scene strong{position:relative;color:white;font-size:12px;text-shadow:0 2px 4px #000}.content{padding:10px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.chip,.button{background:linear-gradient(#a36a38,#70401f);border:1px solid #dca76b;color:#fff;border-radius:8px;padding:7px 4px;text-align:center;font-weight:700;font-size:8px;box-shadow:inset 0 2px #ffffff25,0 2px #583116}.dish{height:72px;border-radius:10px;background:radial-gradient(ellipse at center,#f4c046 0 20%,#b93d25 21% 39%,#45622e 40% 48%,#d9a752 49% 58%,#6e3a22 59% 100%);box-shadow:inset 0 0 0 7px #e8d3a5,0 5px 12px #0003;margin-bottom:8px}.tabs{display:flex;gap:4px;margin-bottom:7px}.tab{flex:1;padding:5px;border-radius:8px;background:#ffffff68;text-align:center;font-size:7px}.tab.on{background:var(--accent);color:#fff}.lines{display:grid;gap:4px}.line{height:7px;background:#5c422526;border-radius:5px}.menu{display:grid;gap:6px}.item{display:grid;grid-template-columns:32px 1fr 18px;gap:5px;align-items:center;background:#fff8;border-radius:8px;padding:5px;font-size:7px}.thumb{width:32px;height:28px;border-radius:6px;background:radial-gradient(circle,#f5bd3b,#a33322 48%,#56301b 50%)}.plus{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent)}.button{position:absolute;left:10px;right:10px;bottom:10px;background:var(--accent);border-color:#ffffff55;padding:9px;font-size:9px}.c2{--bg:#25203a;--panel:#e3cf9c;--accent:#bd2b4b;--accent2:#16a17f}.c3{--bg:#4c4025;--panel:#d6c18b;--accent:#a94131;--accent2:#69804a}.c4{--bg:#8a4d2c;--panel:#f1dfb9;--accent:#d76038;--accent2:#748d60}.c5{--bg:#501d1b;--panel:#ead8b3;--accent:#a51e23;--accent2:#34705b}.c6{--bg:#193b38;--panel:#f0e5ce;--accent:#ba342d;--accent2:#426f60}.c7{--bg:#14263e;--panel:#d5c291;--accent:#e13c32;--accent2:#168aa0}.c8{--bg:#171b24;--panel:#ddd0b4;--accent:#c53e2a;--accent2:#9d703d}.c9{--bg:#49302b;--panel:#ead9bb;--accent:#a94639;--accent2:#397b72}.c10{--bg:#152542;--panel:#e0c993;--accent:#d55331;--accent2:#168c91}.c2 .chip{background:linear-gradient(#376e78,#21454c);border-color:#76d6c6}.c3 .chip{background:#ece0bd;color:#4d3921;border:2px solid #8d6032}.c4 .chip{background:#fff3d4;color:#59351f;border-color:#d89063}.c5 .chip{background:linear-gradient(#a9322f,#6e1719)}.c6 .chip{background:#f7f0dd;color:#31524c;border-color:#62877a}.c7 .chip{background:#284f71;border:2px solid #e7ba42;border-radius:3px}.c8 .chip{background:#4a3130;border-color:#9e734a}.c9 .chip{background:#f4e2be;color:#523224;border-color:#a66342}.c10 .chip{background:#28566a;border-color:#d39d43}.footer{margin-top:32px;color:#bca08d;font-size:13px}
  </style>
</head>
<body><main class="page"><div class="head"><h1>吃什么 · 酒馆游戏感 UI 十案</h1><p>统一展示：口味选择 → AI 推荐 → 门店菜单。用于视觉方向审核，不代表最终文字与数据。</p></div><div class="grid" id="grid"></div><div class="footer">推荐优先审核：05 江湖掌柜、09 掌柜对话、01 炉火木牌。</div></main>
<script>
const data=[
['01','炉火木牌','炉火、胡桃木、黄铜，最温暖稳妥','今晚开哪一桌？',['香辣','鲜香','清淡','酸甜'],'掌柜端菜','附近好店','去下单'],
['02','宝石酒馆','卡牌舞台、木雕与宝石，操作反馈最强','选定你的口味牌',['香辣','鲜香','清淡','酸甜'],'今日推荐牌','酒馆菜单','确认下单'],
['03','炼金食谱','羊皮纸、香料和印章，突出 AI 调配','调一份今天的味道',['香辣','鲜香','清淡','酸甜'],'新菜谱完成','配方菜单','确认菜单'],
['04','手作客栈','手账、布贴与陶瓷，亲切大众','今天吃点舒服的',['香辣','鲜香','清淡','酸甜'],'给你端上来啦','暖心菜单','装进餐篮'],
['05','江湖掌柜','红木、灯笼、朱印，品牌辨识度最高','掌柜，今日想吃什么？',['清淡','辛香','滋补','下饭'],'掌柜荐菜','城中酒楼','就点这些'],
['06','水墨雅宴','暖水墨、窗棂和玉色，适合精致中餐','今日宜吃',['清鲜','辛香','浓郁','酸甜'],'为你题一道菜','城中名楼','确认下单'],
['07','像素冒险','彩色像素世界，套餐像队伍配置','选择风味属性',['香辣','鲜香','清淡','酸甜'],'主菜已解锁','冒险餐单','出发下单'],
['08','夜色炭火','炭火、皮革和暗金，适合夜宵烧烤','今晚想吃点什么',['炭香','辛辣','浓鲜','清爽'],'主厨今夜推荐','附近好店','立即下单'],
['09','掌柜对话','柜台对话式推荐，最匹配 AI 业务','今天想吃什么感觉的？',['想吃辣的','来点清爽','要有肉','随便都行'],'那就给你来这个','按推荐成单','就按这单来'],
['10','冒险商店','菜品陈列和加购爽感，成交反馈强','挑今天的风味',['热辣','鲜美','轻食','甜口'],'今日宝藏菜','商店餐单','带走这一桌']];
const phone=(type,d)=>type===0?`<div class="phone"><div class="bar">吃什么</div><div class="scene"><strong>${d[3]}</strong></div><div class="content"><div class="chips">${d[4].map(x=>`<div class="chip">${x}</div>`).join('')}</div><div class="lines"><i class="line"></i><i class="line"></i></div></div><div class="button">选好了 · 开始推荐</div></div>`:type===1?`<div class="phone"><div class="bar">吃什么 · AI 推荐</div><div class="scene"><strong>${d[5]}</strong></div><div class="content"><div class="dish"></div><div class="tabs"><span class="tab on">一道菜</span><span class="tab">一顿饭</span></div><div class="lines"><i class="line"></i><i class="line"></i><i class="line"></i></div></div><div class="button">看看附近门店</div></div>`:`<div class="phone"><div class="bar">${d[6]}</div><div class="scene"><strong>热气腾腾 · 附近可送</strong></div><div class="content menu">${['招牌菜 ¥36','人气热菜 ¥29','暖汤 ¥16'].map(x=>`<div class="item"><i class="thumb"></i><b>${x}</b><i class="plus">+</i></div>`).join('')}</div><div class="button">${d[7]}</div></div>`;
document.querySelector('#grid').innerHTML=data.map((d,i)=>`<section class="concept c${i+1}" id="concept-${i+1}"><h2>${d[0]} ${d[1]}</h2><div class="desc">${d[2]}</div><div class="phones">${phone(0,d)}${phone(1,d)}${phone(2,d)}</div></section>`).join('');
</script></body></html>
